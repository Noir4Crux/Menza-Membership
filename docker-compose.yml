services:
  db:
    image: postgres:16
    container_name: menza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menza_db
    ports:
      - "5432:5432"
    volumes:
      - menza_pgdata:/var/lib/postgresql/data
volumes:
  menza_pgdata:
